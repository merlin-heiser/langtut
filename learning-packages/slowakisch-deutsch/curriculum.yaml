      - city_places
      - directions_basic
    functions:
      - func_describe
      - func_ask_info
      - func_explain
      - func_request
    grammar_milestones:
      - id: locative_intro
        description: Lokál s v/na/o.
      - id: motion_vs_location
        description: do/na + akuz. (pohyb) vs v/na + lokál (miesto).
      - id: imperatives_intro
        description: Rozkazovací spôsob.
    practice_types:
      - map_directions
      - picture_description
      - role_play
      - sentence_building
    prerequisites:
