      - id: modal_verbs_basic
        description: Môcť/chcieť/musieť v prítomnom čase.
      - id: prepositions_time_basic
        description: O/v/na + časové výrazy.
    practice_types:
      - diary_entries
      - gap_fill
      - conjugation_drills
      - role_play
    prerequisites:
      - a1_introductions_identity
    exit_criteria:
      - Vieš opísať svoj deň v prítomnom čase.
      - Vieš dohodnúť jednoduché stretnutie.
    focusTags:
      - topic_daily_life
      - verb_present
      - func_narrate
  - id: a1_home_city_basic_location
