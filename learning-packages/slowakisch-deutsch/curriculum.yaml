version: "3.0"
language: sk
target_level: B1
curriculum_type: a0_to_b1
orthography_policy:
  canonical_storage:
    unicode_normalization: NFC
    require_diacritics_in_storage: true
  input_matching:
    accept_without_diacritics_as_near_correct: true
    near_correct_action:
      show_correct_form: true
      allow_full_credit: false
      tag_error: error_orthography
    matching_method:
      - exact_match
      - casefold_match
      - strip_diacritics_match
    strip_diacritics_method: NFD_remove_Mn_then_NFC
  llm_reporting:
    orthography_tags_optional: true
    interface_overrides_allowed: true
exercise_type_catalog:
  - pronunciation_drills
  - minimal_pairs
  - dictation_light
  - flashcards_translation
  - gap_fill
  - sentence_building
  - declension_drills
  - conjugation_drills
  - role_play
  - information_gap
  - picture_description
  - story_retell
  - guided_writing
  - free_conversation
  - listening_stub
modules:
  - id: a0_alphabet_pronunciation
    cefr: A0
    title: Alphabet, zvuky, prízvuk
    vocab_target: 40
    vocab_domains:
      - alphabet
      - classroom
      - basic_objects
    functions:
      - func_greet
      - func_spell
      - func_ask_info
      - func_answer_info
    grammar_milestones:
      - id: phonology_soft_hard
        description: Mäkké/tvrdé spoluhlásky, dĺžne, základné páry zvukov.
      - id: stress_basic
        description: Prízvuk na prvej slabike; intonácia otázok.
      - id: pronouns_personal_nom
        description: Osobné zámená v nominatíve.
      - id: verb_byt_present
        description: Byť v prítomnom čase (som/si/je/sme/ste/sú).
      - id: questions_basic
        description: Áno/nie otázky + čo/kto/kde.
    practice_types:
      - pronunciation_drills
      - minimal_pairs
      - dictation_light
      - role_play
    prerequisites: []
    exit_criteria:
      - Čítaš jednoduché slová a vyslovíš dĺžne.
      - Vieš sa pozdraviť a predstaviť jednou vetou.
    focusTags:
      - topic_alphabet
      - grammar_pronunciation
      - func_spell
  - id: a0_survival_phrases
    cefr: A0
    title: "Prežitie: pozdravy, zdvorilosť, trieda"
    vocab_target: 50
    vocab_domains:
      - greetings
      - politeness
      - classroom
      - numbers_0_20
    functions:
      - func_greet
      - func_request
      - func_ask_info
      - func_answer_info
    grammar_milestones:
      - id: negation_ne
        description: Zápor ne- pri slovesách; nie/áno.
      - id: basic_word_order_svo
        description: Základný slovosled SVO.
      - id: copula_basic
        description: To je..., Toto je..., Ja som...
    practice_types:
      - role_play
      - flashcards_translation
      - gap_fill
      - sentence_building
    prerequisites:
      - a0_alphabet_pronunciation
    exit_criteria:
      - Vieš požiadať o zopakovanie (Ešte raz, prosím).
      - Vieš povedať čísla 0–20 a jednoduché ceny.
    focusTags:
      - topic_classroom
      - syntax_basic
      - func_greet
  - id: a1_introductions_identity
    cefr: A1
    title: Predstavenie, identita, základné otázky
    vocab_target: 80
    vocab_domains:
      - identity
      - countries
      - languages
      - contact_details
    functions:
      - func_introduce
      - func_ask_info
      - func_answer_info
      - func_describe
    grammar_milestones:
      - id: nouns_gender
        description: Rod podstatných mien; základná zhoda prídavných mien.
      - id: present_regular_verbs
        description: Prítomný čas pravidelných slovies; základné konjugácie.
      - id: questions_wh_set
        description: Kto/čo/kde/odkiaľ/ako/koľko.
    practice_types:
      - role_play
      - question_answer
      - gap_fill
      - sentence_building
    prerequisites:
      - a0_survival_phrases
    exit_criteria:
      - Vieš vyplniť jednoduchý dotazník o sebe.
      - Vieš krátko hovoriť o pôvode a jazykoch.
    focusTags:
      - topic_identity
      - grammar_gender
      - func_introduce
  - id: a1_family_people
    cefr: A1
    title: Rodina a ľudia
    vocab_target: 80
    vocab_domains:
      - family
      - people
      - relationships
      - photos
    functions:
      - func_describe
      - func_ask_info
      - func_answer_info
    grammar_milestones:
      - id: plural_nominative
        description: Nominatív plurálu; zhoda prídavných mien.
      - id: accusative_intro
        description: Akuzatív ako priamy predmet; zámená v akuzatíve.
      - id: possessives_whose
        description: Privlastňovacie zámená; čí/čia/čie.
    practice_types:
      - picture_description
      - declension_drills
      - role_play
      - flashcards_translation
    prerequisites:
      - a1_introductions_identity
    exit_criteria:
      - Opíšeš rodinu 5–6 vetami.
      - Použiješ nomin./akuz. v bežných vetách.
    focusTags:
      - topic_family
      - grammar_plural
      - func_describe
  - id: a1_daily_routine_time
