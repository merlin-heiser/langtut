      - opinion_debates
      - story_retell
      - gap_fill
    prerequisites:
      - a2_genitive_prepositions
    exit_criteria:
      - Opíšeš školu/prácu a dáš dôvody.
      - Rozlíšiš aspekt pri 15–20 pároch.
    focusTags:
