openapi: 3.1.0
info:
  title: Langtut Learning Package Player API
  version: 0.1.0
servers:
  - url: http://localhost:3210/api/v1
paths:
  /packages:
    get:
      operationId: listLearningPackages
      responses:
        '200': { description: Installierte Pakete und aktive Paket-ID }
  /packages/import:
    post:
      operationId: importLearningPackage
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties: { file: { type: string, format: binary } }
      responses:
        '201': { description: Paket installiert oder aktualisiert }
        '400': { description: Paket ungültig }
  /packages/{id}:
    get:
      operationId: getLearningPackage
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Paketmetadaten und Fähigkeiten }
  /packages/{id}/activate:
    post:
      operationId: activateLearningPackage
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Paket aktiviert }
        '409': { description: Aktives Paket hat laufende Arbeit }
  /activities:
    get:
      operationId: listLearningActivities
      responses:
        '200': { description: Deklarative Lernmethoden des aktiven Pakets }
  /status:
    get:
      operationId: getStatus
      responses:
        '200': { description: Systemstatus }
  /settings:
    get:
      operationId: getSettings
      responses:
        '200': { description: Lokale Runtime-Einstellungen und Fähigkeiten }
  /settings/models:
    post:
      operationId: configureModels
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties: { openai: { type: string }, gemini: { type: string } }
      responses:
        '200': { description: Modellauswahl lokal gespeichert }
  /settings/providers/{provider}/key:
    post:
      operationId: configureProviderKey
      parameters:
        - { name: provider, in: path, required: true, schema: { enum: [openai, gemini] } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [apiKey]
              properties: { apiKey: { type: string, minLength: 1 } }
      responses:
        '200': { description: Schlüssel ausschließlich im lokalen Credential-Adapter gespeichert }
  /settings/anki-api-key:
    post:
      operationId: configureAnkiConnectKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [apiKey]
              properties: { apiKey: { type: string, minLength: 1 } }
      responses:
        '200': { description: AnkiConnect-Schlüssel auf Windows lokal gespeichert }
  /settings/local-mt:
    post:
      operationId: configureLocalMachineTranslation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                enabled: { type: boolean }
                cloudFallback: { type: boolean }
      responses:
        '200': { description: Lokale Übersetzungseinstellungen gespeichert }
  /settings/local-mt/models/{key}/install:
    post:
      operationId: installLocalMachineTranslationModel
      parameters:
        - { name: key, in: path, required: true, schema: { type: string } }
      responses:
        '201': { description: Revisionsgepinntes Modell installiert }
        '400': { description: Laufzeit, Download oder Modell ungültig }
  /costs/summary:
    get:
      operationId: getApiCostSummary
      responses:
        '200':
          description: Kosten der aktuellen ISO-Woche und Gesamtkosten
          content:
            application/json:
              schema: { $ref: '../schemas/contracts.schema.json#/definitions/ApiCostSummary' }
  /curriculum:
    get:
      operationId: getCurriculum
      responses:
        '200':
          description: Modernisiertes Curriculum
          content:
            application/json:
              schema: { $ref: '../schemas/curriculum.schema.json' }
  /curriculum/next:
    get:
      operationId: getNextModule
      responses:
        '200': { description: Nächstes verfügbares Modul }
  /modules/progress:
    get:
      operationId: getModuleProgress
      responses:
        '200': { description: Vorbereitungs- und Milestone-Evidenz pro Modul }
  /session-plans:
    post:
      operationId: createSessionPlan
      responses:
        '201':
          description: Deterministischer Tagesplan
          content:
            application/json:
              schema: { $ref: '../schemas/planner.schema.json' }
  /modules/{id}/prepare:
    post:
      operationId: prepareModule
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '202':
          description: Generierungsjob
          content:
            application/json:
              schema: { $ref: '../schemas/jobs.schema.json' }
  /jobs/{id}:
    get:
      operationId: getJob
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Jobstatus
          content:
            application/json:
              schema: { $ref: '../schemas/jobs.schema.json' }
  /jobs/latest:
    get:
      operationId: getLatestJob
      responses:
        '200': { description: Zuletzt aktualisierter Job oder null }
  /placement-sessions:
    post:
      operationId: startPlacement
      responses:
        '201':
          description: Placement gestartet
          content:
            application/json:
              schema: { $ref: '../schemas/placement.schema.json' }
  /placement-sessions/latest:
    get:
      operationId: getLatestPlacement
      responses:
        '200':
          description: Zuletzt aktualisiertes Placement oder null
          content:
            application/json:
              schema:
                anyOf:
                  - { $ref: '../schemas/placement.schema.json' }
                  - { type: 'null' }
  /placement-sessions/{id}/answers:
    post:
      operationId: answerPlacement
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Nächste Aufgabe oder Einstufung
          content:
            application/json:
              schema: { $ref: '../schemas/placement.schema.json' }
  /placement-sessions/{id}/override:
    post:
      operationId: overridePlacement
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Gewähltes Startmodul }
  /sessions:
    post:
      operationId: startSession
      responses:
        '201': { description: Tutor-Session gestartet }
  /sessions/{id}/turns:
    post:
      operationId: createTutorTurn
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Tutorantwort
          content:
            application/json:
              schema: { $ref: '../schemas/session.schema.json' }
  /sessions/{id}/complete:
    post:
      operationId: completeSession
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Strukturierter Sessionreport
          content:
            application/json:
              schema: { $ref: '../schemas/reports.schema.json' }
  /sessions/{id}/activity-turns:
    post:
      operationId: executeActivityTurn
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message]
              properties: { message: { type: string } }
      responses:
        '200': { description: Rollenreaktionen gemäß deklarativer Lernmethode }
        '409': { description: Aktivität beendet oder nicht ausführbar }
  /modules/{id}/milestones/{milestoneId}/attempt:
    post:
      operationId: recordMilestoneAttempt
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: milestoneId, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Aktualisierter Modulstatus }
  /quarantine:
    get:
      operationId: getQuarantine
      responses:
        '200': { description: Ungeklärte Inhalte }
  /lexicon/lookup:
    post:
      operationId: lookupLexicon
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '../schemas/contracts.schema.json#/definitions/LexiconLookupRequest' }
      responses:
        '200':
          description: Lokaler oder kontextuell aufgelöster Wörterbuchtreffer
          content:
            application/json:
              schema: { $ref: '../schemas/contracts.schema.json#/definitions/LexiconLookupResult' }
  /lexicon/staging:
    post:
      operationId: stageLexiconCandidate
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '../schemas/contracts.schema.json#/definitions/LexiconStagingRequest' }
      responses:
        '201': { description: Eintrag zur Qualitätsprüfung vorgemerkt }
  /export.jsonl:
    get:
      operationId: exportPortableLog
      responses:
        '200':
          description: Portabler JSONL-Snapshot der nachvollziehbaren lokalen Daten
          content:
            application/x-ndjson:
              schema: { type: string }
  /integrations/anki/status:
    get:
      operationId: getAnkiStatus
      responses:
        '200': { description: AnkiConnect-Status }
  /integrations/anki/setup/preview:
    post:
      operationId: previewAnkiSetup
      responses:
        '200': { description: Geplanter Anki-Setup-Diff }
  /integrations/anki/setup/apply:
    post:
      operationId: applyAnkiSetup
      responses:
        '200': { description: Bestätigtes Setup-Ergebnis }
